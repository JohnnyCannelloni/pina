# Alembic configuration.
#
# Note there is no sqlalchemy.url here. It is deliberately omitted so there is
# exactly one source for the database URL — app/config.py, which reads .env.
# alembic/env.py sets it at runtime. A URL in this file would be a second,
# silently-disagreeing answer to "which database am I migrating?".
[alembic]
script_location = alembic

# Migration filenames get a zero-padded number prefix, so `ls versions/` sorts
# in the order the migrations actually apply.
file_template = %%(rev)s_%%(slug)s

prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# postgres for local development.
#
# one server, two databases: `pina` for the app and `pina_test` for pytest
# (created by docker/init-test-db.sql on first start).
#
#   docker compose up -d     start
#   docker compose down      stop, keep the data
#   docker compose down -v   stop and delete the data
services:
  db:
    image: postgres:17
    container_name: pina-db
    environment:
      POSTGRES_USER: pina
      POSTGRES_PASSWORD: pina
      POSTGRES_DB: pina
    ports:
      # host:container
      - "5432:5432"
    volumes:
      # named volume, so data survives restarts.
      - pgdata:/var/lib/postgresql/data
      # runs once, on first initialisation.
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      # lets `docker compose up -d --wait` block until postgres is ready.
      test: ["CMD-SHELL", "pg_isready -U pina -d pina"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
